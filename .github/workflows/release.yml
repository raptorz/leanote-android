name: Mobile Release

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn
  FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: version
        name: Validate tag against application version
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected MAJOR.MINOR.PATCH tag without v'; exit 1; }
          version=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\)+[0-9][0-9]*$/\1/p' pubspec.yaml)
          [[ "$version" == "$tag" ]] || { echo 'Tag must match pubspec.yaml version (which must include +buildNumber)'; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  tests:
    needs: validate
    uses: ./.github/workflows/ci.yml

  android:
    needs: [validate, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx3G -XX:MaxMetaspaceSize=1G" -Dorg.gradle.workers.max=2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require release signing credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          for name in KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "Missing signing secret: $name"; exit 1; }
          done
          umask 077
          keystore_path="$RUNNER_TEMP/gemsnote-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter config --jdk-dir "$JAVA_HOME"
      - run: flutter pub get --enforce-lockfile
      - name: Build signed release APK and AAB
        run: |
          flutter build apk --release --no-pub
          flutter build appbundle --release --no-pub
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk "release/gemsnote-$RELEASE_VERSION-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab "release/gemsnote-$RELEASE_VERSION-android.aab"
          (cd release && sha256sum ./*.apk ./*.aab > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android-release
          path: release/
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing file
        if: always()
        run: rm -f -- "$RUNNER_TEMP/gemsnote-release.jks"

  publish:
    needs: [validate, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mobile-android-release
          path: release
      - name: Publish Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Gemsnote Mobile $GITHUB_REF_NAME"
